<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taj Darbar - Staff Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#d97706', sidebar: '#0f172a', light: '#f8fafc', card: '#ffffff' } } } }
  </script>
  <style>
    .dash-card { box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(226,232,240,0.8); }
    @keyframes redBlueFlash { 0%, 100% { border-color: #ef4444; } 50% { border-color: #f59e0b; } }
    .urgent-alarm { animation: redBlueFlash 1s infinite; border-width: 4px; }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-light">

  <div id="loginScreen" class="fixed inset-0 bg-sidebar z-[100] flex flex-col items-center justify-center p-5">
    <div class="bg-card p-10 rounded-3xl text-center w-full max-w-sm shadow-2xl border-t-8 border-primary">
      <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl font-black shadow-inner">TD</div>
      <h2 class="text-2xl font-black text-slate-900 mb-2">Taj Darbar Workspace</h2>
      <input type="password" id="sysPin" placeholder="Enter PIN" class="w-full text-center p-4 bg-slate-50 border border-slate-200 rounded-xl font-black text-2xl outline-none focus:border-primary mb-4 tracking-[0.5em]">
      <button onclick="attemptLogin()" class="w-full bg-primary text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-transform">LOGIN</button>
    </div>
  </div>

  <div class="flex h-screen overflow-hidden hidden" id="mainLayout">
    <aside class="w-64 bg-sidebar text-white flex flex-col shadow-xl z-20">
      <div class="p-6 border-b border-white/10">
        <h1 class="font-black text-xl text-primary">Taj Darbar</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">Role: <span id="roleText" class="text-white"></span></p>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <button onclick="switchTab('orders')" id="tab-orders" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm bg-primary/10 text-primary tab-btn">📦 Active Floor</button>
        <button onclick="switchTab('inventory')" id="tab-inventory" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 tab-btn admin-only hidden">🍔 Menu Manager</button>
      </nav>
      <div class="p-4 border-t border-white/10 text-center">
        <button onclick="location.reload()" class="text-red-400 font-bold text-sm hover:text-red-300">Log Out</button>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
      
      <!-- ORDERS TAB -->
      <section id="view-orders" class="tab-section">
        <h2 class="text-3xl font-black text-slate-900 mb-8">Floor Operations</h2>
        <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
      </section>

      <!-- INVENTORY / ADMIN TAB -->
      <section id="view-inventory" class="tab-section hidden">
        <h2 class="text-3xl font-black text-slate-900 mb-8">Menu Manager</h2>
        
        <div class="bg-card p-6 rounded-3xl dash-card mb-8 border-t-4 border-primary">
          <h3 class="text-lg font-black text-slate-900 mb-4">➕ Add New Dish</h3>
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div class="md:col-span-1"><label class="text-[10px] font-black text-slate-400 block mb-1">Dish Name</label><input type="text" id="newDishName" class="w-full p-3 bg-light border border-slate-200 rounded-xl font-bold text-sm outline-none"></div>
            <div class="md:col-span-1"><label class="text-[10px] font-black text-slate-400 block mb-1">Category</label>
              <select id="newDishCat" class="w-full p-3 bg-light border border-slate-200 rounded-xl font-bold text-sm outline-none">
                <option value="CHICKEN MANDI">CHICKEN MANDI</option><option value="MUTTON MANDI">MUTTON MANDI</option><option value="SEAFOOD MANDI">SEAFOOD MANDI</option><option value="CHICKEN BIRYANI">CHICKEN BIRYANI</option><option value="MIXED MANDI">MIXED MANDI</option><option value="CURRIES">CURRIES</option><option value="DESSERTS">DESSERTS</option>
              </select>
            </div>
            <div class="md:col-span-1"><label class="text-[10px] font-black text-slate-400 block mb-1">Price (₹)</label><input type="number" id="newDishPrice" class="w-full p-3 bg-light border border-slate-200 rounded-xl font-bold text-sm outline-none"></div>
            <div class="md:col-span-1"><label class="text-[10px] font-black text-slate-400 block mb-1">Image URL</label><input type="text" id="newDishImg" placeholder="Paste link" class="w-full p-3 bg-light border border-slate-200 rounded-xl font-bold text-sm outline-none"></div>
            <div class="md:col-span-1"><button onclick="addNewDish()" class="w-full bg-primary text-white font-black py-3 rounded-xl active:scale-95 transition-transform">ADD DISH</button></div>
          </div>
        </div>

        <div id="inventoryList" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>

        <div class="mt-16 pt-8 border-t border-slate-200 text-center">
          <button onclick="factoryResetSystem()" class="bg-red-50 text-red-600 border border-red-200 px-8 py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all">
            ⚠️ FACTORY RESET: Load Full Taj Darbar Database
          </button>
        </div>
      </section>

    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAc5Nfz9pNp4dNmNr3OKQFcZEaBJ5KH3dg",
      authDomain: "algani-cafe.firebaseapp.com",
      databaseURL: "https://algani-cafe-default-rtdb.firebaseio.com",
      projectId: "algani-cafe",
      storageBucket: "algani-cafe.firebasestorage.app",
      messagingSenderId: "44056411552",
      appId: "1:44056411552:web:a245596401ca636fb0f8c5",
      measurementId: "G-9GDVR0V5VE"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxxmng1jPefetM-9Xzt28v1Kj3RMuAEmNEBqPS1GAIzYUZH_wMRLkl56Y8YZe83D3_vMg/exec";

    let currentRole = null;
    let menuCache = {};
    window.currentTables = {};

    window.attemptLogin = function() {
      const pin = document.getElementById('sysPin').value.trim();
      if (pin === 'admin999') currentRole = 'admin';
      else if (pin === 'waiter999') currentRole = 'waiter';
      else if (pin === 'kitchen999') currentRole = 'kitchen';
      else return alert("Invalid PIN");

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainLayout').classList.remove('hidden');
      document.getElementById('roleText').innerText = currentRole.toUpperCase();
      if(currentRole === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
      
      loadSystem();
    };

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        if(b.id === `tab-${tab}`) { b.classList.add('bg-primary/10','text-primary'); b.classList.remove('text-slate-400'); }
        else { b.classList.remove('bg-primary/10','text-primary'); b.classList.add('text-slate-400'); }
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
    };

    function loadSystem() {
      // Floor Listener
      db.ref('active_tables').on('value', snap => {
        const grid = document.getElementById('kitchenGrid'); grid.innerHTML = '';
        const tables = snap.val() || {};
        window.currentTables = tables;
        
        Object.entries(tables).sort((a,b)=>a[1].timestamp-b[1].timestamp).forEach(([id, table]) => {
          let border = table.status==='pending'?'urgent-alarm border-red-500':(table.status==='bill_requested'?'urgent-alarm border-amber-500':'border-slate-200');
          let btnHtml = '';
          
          if(currentRole === 'admin') {
            if(table.status === 'pending' || table.status === 'cooking') {
               btnHtml = `<button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black mb-2" onclick="db.ref('active_tables/${id}').update({status:'cooking'})">Mark Cooking</button>
                          <button class="w-full bg-emerald-500 text-white py-3 rounded-xl font-black" onclick="db.ref('active_tables/${id}').update({status:'served'})">Mark Served</button>`;
            } else {
               btnHtml = `<button class="w-full bg-slate-900 text-white py-4 rounded-xl font-black" onclick="clearTable('${id}')">Clear & Bill Table</button>`;
            }
          } else if(currentRole === 'kitchen') {
            if(table.status !== 'served' && table.status !== 'bill_requested') {
              btnHtml = `<button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black mb-2" onclick="db.ref('active_tables/${id}').update({status:'cooking'})">Acknowledge</button>
                         <button class="w-full bg-emerald-500 text-white py-3 rounded-xl font-black" onclick="db.ref('active_tables/${id}').update({status:'served'})">Food Ready / Served</button>`;
            } else { btnHtml = `<button class="w-full bg-light text-slate-400 py-4 rounded-xl font-black" disabled>Done</button>`; }
          }

          let itemsHtml = Object.values(table.line_items||{}).map(li => 
            `<div class="${li.cancelled?'line-through text-red-400':''} font-semibold text-sm py-1 border-b border-slate-100 flex items-center gap-2">
              ${li.custom_img ? `<img src="${li.custom_img}" class="w-8 h-8 rounded-md object-cover">` : ''}
              ${li.name} (x${li.qty})
            </div>`
          ).join('');

          grid.innerHTML += `
            <div class="dash-card bg-card p-6 rounded-3xl ${border} flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                  <div><span class="text-[10px] font-black text-slate-400 block">Table</span><span class="font-black text-2xl">${table.table}</span></div>
                  <span class="text-xs font-black uppercase bg-slate-100 px-3 py-1.5 rounded-lg">${table.status.replace('_',' ')}</span>
                </div>
                <div class="mb-4 max-h-48 overflow-y-auto">${itemsHtml}</div>
              </div>
              <div>
                <div class="flex justify-between items-end mb-4">
                  <span class="text-xs font-bold text-slate-400">📞 ${table.phone}</span>
                  <span class="font-black text-xl">₹${table.total}</span>
                </div>
                ${btnHtml}
              </div>
            </div>`;
        });
      });

      // Menu Listener
      if(currentRole === 'admin') {
        db.ref('menu').on('value', snap => {
          menuCache = snap.val() || {};
          const list = document.getElementById('inventoryList'); list.innerHTML = '';
          Object.entries(menuCache).forEach(([id, item]) => {
            list.innerHTML += `
              <div class="dash-card bg-card p-4 rounded-2xl flex items-center gap-4">
                <img src="${item.image_url}" class="w-16 h-16 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1544025162-8111142154ea?w=200&q=80'">
                <div class="flex-1">
                  <h4 class="font-black text-sm">${item.name}</h4>
                  <p class="text-[10px] font-black text-slate-400 uppercase">${item.category} · ₹${item.base_price}</p>
                </div>
                <button onclick="db.ref('menu/${id}').remove()" class="text-red-400 font-bold text-xs bg-red-50 px-3 py-2 rounded-lg hover:bg-red-100">Delete</button>
              </div>`;
          });
        });
      }
    }

    window.addNewDish = function() {
      const name = document.getElementById('newDishName').value.trim();
      const price = parseFloat(document.getElementById('newDishPrice').value);
      const img = document.getElementById('newDishImg').value.trim() || 'https://images.unsplash.com/photo-1544025162-8111142154ea?w=500&q=80';
      if(!name || isNaN(price)) return alert("Valid Name and Price required.");
      
      db.ref('menu/item_' + Date.now()).set({ name: name, category: document.getElementById('newDishCat').value, base_price: price, image_url: img, is_special: false, stock_count: 100 })
        .then(() => { document.getElementById('newDishName').value = ''; document.getElementById('newDishPrice').value = ''; document.getElementById('newDishImg').value = ''; });
    };

    window.clearTable = function(id) {
      const table = window.currentTables[id];
      if(!table) return;
      
      const sheetPayload = { orderId: table.orderId, tableNo: table.table, phone: table.phone, totalAmount: table.total, paymentMethod: "CASH", itemsDetails: table.items };
      fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(sheetPayload) }).catch(e=>console.log(e));
      
      db.ref('active_tables/'+id).remove();
    };

    const factoryMenuData = {
      'td_bbq_full_mandi': { name: "BBQ FULL MANDI", category: "CHICKEN MANDI", base_price: 940, stock_count: 100, is_special: false, image_url: "fullchickenmandi..webp" },
      'td_3pc_bbq_half_mandi': { name: "3 PC BBQ HALF MANDI", category: "CHICKEN MANDI", base_price: 790, stock_count: 100, is_special: true, image_url: "fullchickenmandi 3 pcs..webp" },
      'td_crispy_chicken_full': { name: "CRISPY CHICKEN FULL MANDI", category: "CHICKEN MANDI", base_price: 950, stock_count: 100, is_special: false, image_url: "fullchickenmandi..webp" },
      'td_full_chicken_dum_biryani': { name: "FULL CHICKEN DUM BIRYANI", category: "CHICKEN BIRYANI", base_price: 290, stock_count: 100, is_special: false, image_url: "fullchicken.jpeg" },
      'td_chicken_jumbo_pack': { name: "CHICKEN JUMBO PACK", category: "CHICKEN BIRYANI", base_price: 1150, stock_count: 50, is_special: true, image_url: "jumbobiryani..webp" },
      'td_fish_full_mandi': { name: "FISH FULL MANDI", category: "SEAFOOD MANDI", base_price: 900, stock_count: 50, is_special: false, image_url: "fishfullmandi.jpeg" },
      'td_fish_half_mandi': { name: "FISH HALF MANDI", category: "SEAFOOD MANDI", base_price: 480, stock_count: 50, is_special: false, image_url: "fishmandi..webp" },
      'td_chicken_65': { name: "CHICKEN 65", category: "CHICKEN STARTERS", base_price: 350, stock_count: 100, is_special: false, image_url: "https://images.unsplash.com/photo-1610057099443-fde8c4d50f91?w=500&q=80" },
      'td_mixed_full_mandi': { name: "MIXED FULL MANDI", category: "MIXED MANDI", base_price: 1350, stock_count: 30, is_special: true, image_url: "juicymandi..jpeg" },
      'td_butter_chicken': { name: "BUTTER CHICKEN", category: "CURRIES", base_price: 370, stock_count: 50, is_special: false, image_url: "butterchicken.webp" },
      'td_kaddu_ki_kheer': { name: "KADDU KI KHEER", category: "DESSERTS", base_price: 150, stock_count: 50, is_special: true, image_url: "kadduki kheer.jpeg" },
      'td_nawabi_full_mutton': { name: "NAWABI FULL MUTTON MANDI", category: "MUTTON MANDI", base_price: 1300, stock_count: 40, is_special: true, image_url: "https://images.unsplash.com/photo-1543362906-acfc16c67564?w=500&q=80" }
    };

    window.factoryResetSystem = function() {
      if(!confirm(`⚠️ This will REPLACE the entire live menu with the Taj Darbar default database. Continue?`)) return;
      db.ref('menu').set(factoryMenuData)
        .then(() => alert(`✅ Taj Darbar menu successfully loaded!`))
        .catch(err => alert('Error: ' + err.message));
    };
  </script>
</body>
</html>
