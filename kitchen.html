<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taj Darbar - Staff Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Core, DB, and Storage -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#d97706', sidebar: '#0f172a', light: '#f8fafc', card: '#ffffff' } } } }
  </script>
  <style>
    .dash-card { box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(226,232,240,0.8); }
    @keyframes redBlueFlash { 0%, 100% { border-color: #ef4444; } 50% { border-color: #f59e0b; } }
    .urgent-alarm { animation: redBlueFlash 1.5s infinite; border-width: 3px; }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-light">

  <div id="loginScreen" class="fixed inset-0 bg-sidebar z-[100] flex flex-col items-center justify-center p-5">
    <div class="bg-card p-10 rounded-[2rem] text-center w-full max-w-sm shadow-[0_20px_50px_rgba(0,0,0,0.5)] border-t-8 border-primary">
      <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner border-4 border-white">👑</div>
      <h2 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Taj Darbar</h2>
      <p class="text-slate-500 font-bold text-sm mb-6 uppercase tracking-widest">Workspace Login</p>
      <input type="password" id="sysPin" placeholder="Enter PIN" class="w-full text-center p-4 bg-slate-50 border border-slate-200 rounded-xl font-black text-2xl outline-none focus:border-primary mb-6 tracking-[0.5em] transition-colors">
      <button onclick="attemptLogin()" class="w-full bg-primary text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-transform text-lg">LOGIN</button>
    </div>
  </div>

  <div class="flex h-screen overflow-hidden hidden" id="mainLayout">
    <aside class="w-64 bg-sidebar text-white flex flex-col shadow-2xl z-20">
      <div class="p-6 border-b border-white/10">
        <h1 class="font-black text-2xl text-primary tracking-tight">Taj Darbar</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase mt-1 tracking-widest">Role: <span id="roleText" class="text-white"></span></p>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <button onclick="switchTab('orders')" id="tab-orders" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm bg-primary/20 text-primary transition-all tab-btn">📦 Active Floor</button>
        <button onclick="switchTab('inventory')" id="tab-inventory" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 transition-all tab-btn admin-only hidden">🍔 Menu Manager</button>
      </nav>
      <div class="p-6 border-t border-white/10 text-center bg-slate-900/50">
        <button onclick="location.reload()" class="w-full text-red-400 font-black text-sm bg-red-500/10 py-3 rounded-xl hover:bg-red-500 hover:text-white transition-all">Log Out</button>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 bg-slate-50">
      
      <!-- ORDERS TAB -->
      <section id="view-orders" class="tab-section">
        <h2 class="text-3xl font-black text-slate-900 mb-8 tracking-tight">Floor Operations</h2>
        <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
      </section>

      <!-- MENU MANAGER TAB -->
      <section id="view-inventory" class="tab-section hidden">
        <h2 class="text-3xl font-black text-slate-900 mb-8 tracking-tight">Menu Manager</h2>
        
        <div class="bg-card p-6 rounded-3xl dash-card mb-8 border-t-4 border-primary shadow-lg">
          <h3 class="text-xl font-black text-slate-900 mb-5">➕ Add New Dish</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 items-start">
            <div class="col-span-1">
              <label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">Dish Name</label>
              <input type="text" id="newDishName" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-primary focus:bg-white transition-colors">
            </div>
            <div class="col-span-1">
              <label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">Category</label>
              <select id="newDishCat" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-primary focus:bg-white transition-colors">
                <option value="Chicken Mandi">Chicken Mandi</option><option value="Mutton Mandi">Mutton Mandi</option><option value="Seafood Mandi">Seafood Mandi</option>
                <option value="Chicken Biryani">Chicken Biryani</option><option value="Mutton Biryani">Mutton Biryani</option><option value="Mixed Mandi">Mixed Mandi</option>
                <option value="Veg Mandi">Veg Mandi</option><option value="Chicken Starters">Chicken Starters</option><option value="Curries">Curries</option><option value="Breads">Breads</option><option value="Desserts">Desserts</option>
              </select>
            </div>
            <div class="col-span-1">
              <label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">Base Price (₹)</label>
              <input type="number" id="newDishPrice" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-primary focus:bg-white transition-colors">
            </div>
            <div class="col-span-1">
              <label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">Image (Upload or URL)</label>
              <input type="file" id="newDishFile" accept="image/*" class="w-full mb-2 text-xs font-semibold text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 cursor-pointer">
              <input type="text" id="newDishImg" placeholder="Or paste link..." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-primary focus:bg-white">
            </div>
          </div>
          
          <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <label class="flex items-center gap-2 cursor-pointer bg-amber-50 px-3 py-2 rounded-xl">
                <input type="checkbox" id="newDishSpecial" class="w-4 h-4 accent-amber-500">
                <span class="text-xs font-black text-amber-700">⭐ Mark Special</span>
              </label>
              <div class="text-xs text-slate-500 font-semibold" id="uploadStatus"></div>
            </div>
            <button onclick="addNewDish()" id="addDishBtn" class="bg-primary text-white font-black py-3 px-8 rounded-xl active:scale-95 transition-transform shadow-md">ADD DISH</button>
          </div>
        </div>

        <div class="mb-4">
          <input type="text" id="menuSearch" oninput="renderInventory()" placeholder="🔍 Search menu..." class="w-full max-w-sm p-3 bg-white border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-primary shadow-sm">
        </div>
        <div id="inventoryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

      </section>
    </main>
  </div>

  <script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAc5Nfz9pNp4dNmNr3OKQFcZEaBJ5KH3dg",
      authDomain: "algani-cafe.firebaseapp.com",
      databaseURL: "https://algani-cafe-default-rtdb.firebaseio.com",
      projectId: "algani-cafe",
      storageBucket: "algani-cafe.firebasestorage.app",
      messagingSenderId: "44056411552",
      appId: "1:44056411552:web:a245596401ca636fb0f8c5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    let currentRole = null, menuCache = {};
    window.currentTables = {};

    window.attemptLogin = function() {
      const pin = document.getElementById('sysPin').value.trim();
      if (pin === 'admin999') currentRole = 'admin';
      else if (pin === 'waiter999') currentRole = 'waiter';
      else if (pin === 'kitchen999') currentRole = 'kitchen';
      else return alert("Invalid PIN");

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainLayout').classList.remove('hidden');
      document.getElementById('roleText').innerText = currentRole.toUpperCase();
      if(currentRole === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
      loadSystem();
    };

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        if(b.id === `tab-${tab}`) { b.classList.add('bg-primary/20','text-primary'); b.classList.remove('text-slate-400'); }
        else { b.classList.remove('bg-primary/20','text-primary'); b.classList.add('text-slate-400'); }
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
    };

    function loadSystem() {
      db.ref('active_tables').on('value', snap => {
        const grid = document.getElementById('kitchenGrid'); grid.innerHTML = '';
        window.currentTables = snap.val() || {};
        
        Object.entries(window.currentTables).sort((a,b)=>a[1].timestamp-b[1].timestamp).forEach(([id, t]) => {
          let bClass = t.status==='pending'?'urgent-alarm border-red-500':(t.status==='bill_requested'?'urgent-alarm border-amber-500':'border-slate-200');
          let btn = '';
          
          if(currentRole === 'admin') {
            if(t.status === 'pending' || t.status === 'cooking') {
               btn = `<button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black mb-2 shadow-md hover:bg-blue-700 transition-colors" onclick="db.ref('active_tables/${id}').update({status:'cooking'})">Mark Cooking</button>
                      <button class="w-full bg-emerald-500 text-white py-3 rounded-xl font-black shadow-md hover:bg-emerald-600 transition-colors" onclick="db.ref('active_tables/${id}').update({status:'served'})">Mark Served</button>`;
            } else { btn = `<button class="w-full bg-slate-900 text-white py-4 rounded-xl font-black shadow-lg hover:bg-slate-800 transition-colors" onclick="clearTable('${id}')">Clear & Bill Table</button>`; }
          } else if(currentRole === 'kitchen') {
            if(t.status !== 'served' && t.status !== 'bill_requested') {
              btn = `<button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black mb-2 shadow-md" onclick="db.ref('active_tables/${id}').update({status:'cooking'})">Acknowledge (Cooking)</button>
                     <button class="w-full bg-emerald-500 text-white py-3 rounded-xl font-black shadow-md" onclick="db.ref('active_tables/${id}').update({status:'served'})">Food Ready / Served</button>`;
            } else { btn = `<button class="w-full bg-slate-100 text-slate-400 py-4 rounded-xl font-black" disabled>Done</button>`; }
          }

          let items = Object.values(t.line_items||{}).map(li => 
            `<div class="${li.cancelled?'line-through text-red-400 opacity-60':''} font-semibold text-sm py-2 border-b border-slate-100 flex items-center gap-3">
              ${li.custom_img ? `<img src="${li.custom_img}" class="w-10 h-10 rounded-lg object-cover border border-slate-200">` : ''}
              <span>${li.name} <span class="text-primary font-black ml-1">x${li.qty}</span>${li.note?`<br><span class="text-[10px] text-amber-600">Note: ${li.note}</span>`:''}</span>
            </div>`
          ).join('');

          grid.innerHTML += `
            <div class="dash-card bg-card p-6 rounded-[2rem] ${bClass} flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                  <div><span class="text-[10px] font-black text-slate-400 block uppercase tracking-widest">Table</span><span class="font-black text-3xl text-royal">${t.table}</span></div>
                  <span class="text-xs font-black uppercase bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg shadow-sm">${t.status.replace('_',' ')}</span>
                </div>
                <div class="mb-5 max-h-56 overflow-y-auto pr-2">${items}</div>
              </div>
              <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between items-end mb-4">
                  <span class="text-xs font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-md">📞 ${t.phone}</span>
                  <span class="font-black text-2xl text-royal tracking-tight">₹${t.total}</span>
                </div>
                ${btn}
              </div>
            </div>`;
        });
      });

      if(currentRole === 'admin') {
        db.ref('menu').on('value', snap => { menuCache = snap.val() || {}; renderInventory(); });
      }
    }

    window.renderInventory = function() {
      const list = document.getElementById('inventoryList'), q = document.getElementById('menuSearch').value.toLowerCase();
      list.innerHTML = '';
      Object.entries(menuCache).forEach(([id, item]) => {
        if(q && !item.name.toLowerCase().includes(q) && !item.category.toLowerCase().includes(q)) return;
        list.innerHTML += `
          <div class="dash-card bg-card p-4 rounded-2xl flex flex-col relative">
            ${item.is_special ? '<span class="absolute top-2 left-2 bg-amber-500 text-white text-[9px] font-black px-2 py-0.5 rounded shadow-sm z-10">⭐ SPECIAL</span>' : ''}
            <img src="${item.image_url}" class="w-full h-32 rounded-xl object-cover mb-3 bg-slate-100" onerror="this.src='https://images.unsplash.com/photo-1544025162-8111142154ea?w=200&q=80'">
            <h4 class="font-black text-base text-royal leading-tight mb-1">${item.name}</h4>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">${item.category} · ₹${item.base_price}</p>
            <div class="mt-auto border-t border-slate-100 pt-3 flex gap-2">
              <button onclick="toggleSpecial('${id}', ${item.is_special})" class="flex-1 text-[10px] font-bold py-2 rounded-lg ${item.is_special?'bg-amber-100 text-amber-700':'bg-slate-100 text-slate-600'}">Toggle Spec</button>
              <button onclick="db.ref('menu/${id}').remove()" class="flex-1 text-red-500 font-bold text-[10px] bg-red-50 py-2 rounded-lg hover:bg-red-100">Delete</button>
            </div>
          </div>`;
      });
    };

    window.toggleSpecial = function(id, cur) { db.ref('menu/'+id).update({is_special: !cur}); };

    window.addNewDish = async function() {
      const n = document.getElementById('newDishName').value.trim();
      const p = parseFloat(document.getElementById('newDishPrice').value);
      const fileInput = document.getElementById('newDishFile');
      let img = document.getElementById('newDishImg').value.trim();
      
      if(!n || isNaN(p)){ return alert("Valid Name and Price required."); }

      const btn = document.getElementById('addDishBtn');
      const stat = document.getElementById('uploadStatus');
      btn.disabled = true; btn.innerText = "SAVING...";

      if(fileInput.files.length > 0) {
        stat.innerText = "Uploading image...";
        try {
          const file = fileInput.files[0];
          const ref = storage.ref().child('menu_images/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, ''));
          await ref.put(file);
          img = await ref.getDownloadURL();
          stat.innerText = "Upload complete!";
        } catch(e) {
          alert("Image upload failed: " + e.message + "\nSaving without image.");
          stat.innerText = "";
        }
      }

      if(!img) img = 'https://images.unsplash.com/photo-1544025162-8111142154ea?w=500&q=80';

      db.ref('menu/item_' + Date.now()).set({ 
        name: n, category: document.getElementById('newDishCat').value, 
        base_price: p, image_url: img, is_special: document.getElementById('newDishSpecial').checked, stock_count: 100 
      }).then(() => { 
        document.getElementById('newDishName').value = ''; document.getElementById('newDishPrice').value = ''; 
        document.getElementById('newDishImg').value = ''; fileInput.value = ''; document.getElementById('newDishSpecial').checked = false;
        stat.innerText = ""; btn.disabled = false; btn.innerText = "ADD DISH";
        alert(`✅ ${n} added successfully!`);
      }).catch(e => { alert("Error: "+e.message); btn.disabled = false; btn.innerText = "ADD DISH"; });
    };

    window.clearTable = function(id) {
      if(!confirm("Are you sure you want to clear this table and end the session?")) return;
      db.ref('active_tables/'+id).remove().then(()=>alert("Table cleared.")).catch(e=>alert("Error: "+e.message));
    };
  </script>
</body>
</html>
